<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌱 Chunk · ADHD Project Manager</title>
    <style>
        /* ── Reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f6f9fc;
            color: #1e2b3c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            transition: background 0.3s, color 0.3s;
        }
        body.dark {
            background: #121a24;
            color: #e6edf5;
        }

        /* ── App card ── */
        .app {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 20, 30, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.5);
            padding: 1.8rem 2rem 2.2rem;
            transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        body.dark .app {
            background: rgba(22, 34, 50, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.04);
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            margin-bottom: 1.8rem;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header-left h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #3b7b9b, #5ba0c9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.dark .header-left h1 {
            background: linear-gradient(135deg, #7bb8dd, #a8d4f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left .emoji {
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
        }
        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* ── Buttons ── */
        .btn {
            border: none;
            background: rgba(59, 123, 155, 0.10);
            color: #1e2b3c;
            padding: 0.5rem 1.1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid transparent;
        }
        .btn:hover {
            background: rgba(59, 123, 155, 0.20);
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: #3b7b9b;
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 123, 155, 0.25);
        }
        .btn-primary:hover {
            background: #2f6783;
            box-shadow: 0 6px 18px rgba(59, 123, 155, 0.30);
        }
        body.dark .btn-primary {
            background: #4e8fb0;
            color: #fff;
            box-shadow: 0 4px 16px rgba(78, 143, 176, 0.25);
        }
        body.dark .btn-primary:hover {
            background: #3b7b9b;
        }

        .btn-ghost {
            background: transparent;
            color: #5a7b8f;
        }
        .btn-ghost:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        body.dark .btn-ghost {
            color: #a0bccf;
        }
        body.dark .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-danger {
            background: rgba(200, 70, 70, 0.10);
            color: #b34a4a;
        }
        .btn-danger:hover {
            background: rgba(200, 70, 70, 0.20);
        }
        body.dark .btn-danger {
            color: #e08080;
            background: rgba(200, 70, 70, 0.12);
        }
        body.dark .btn-danger:hover {
            background: rgba(200, 70, 70, 0.22);
        }

        .btn-icon {
            padding: 0.5rem 0.65rem;
            border-radius: 50%;
            font-size: 1.1rem;
            background: transparent;
        }
        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.06);
        }
        body.dark .btn-icon:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            font-size: 1.3rem;
            padding: 0.3rem 0.6rem;
            border-radius: 2rem;
            background: rgba(0, 0, 0, 0.04);
            border: none;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
        }
        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: scale(1.05);
        }
        body.dark .theme-toggle {
            background: rgba(255, 255, 255, 0.06);
        }
        body.dark .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ── Layout ── */
        .main-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2rem;
            min-height: 450px;
        }
        @media (max-width: 720px) {
            .app {
                padding: 1.2rem 1.2rem 1.6rem;
                border-radius: 1.4rem;
            }
            .main-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        /* ── Sidebar ── */
        .sidebar {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 1.4rem;
            padding: 1.2rem 1rem 1rem;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-height: 520px;
            display: flex;
            flex-direction: column;
        }
        body.dark .sidebar {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            padding: 0 0.2rem;
        }
        .sidebar-header h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
            color: #5a7b8f;
        }
        body.dark .sidebar-header h2 {
            color: #8aabbf;
        }

        .project-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            padding-right: 0.2rem;
        }
        .project-list::-webkit-scrollbar {
            width: 4px;
        }
        .project-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .project-list::-webkit-scrollbar-thumb {
            background: rgba(59, 123, 155, 0.25);
            border-radius: 4px;
        }

        .project-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 0.8rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            position: relative;
        }
        .project-item:hover {
            background: rgba(59, 123, 155, 0.07);
        }
        .project-item.active {
            background: rgba(59, 123, 155, 0.12);
            border-color: rgba(59, 123, 155, 0.20);
            font-weight: 600;
        }
        body.dark .project-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        body.dark .project-item.active {
            background: rgba(78, 143, 176, 0.15);
            border-color: rgba(78, 143, 176, 0.20);
        }

        .project-item .name {
            flex: 1;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .project-item .badge {
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(59, 123, 155, 0.12);
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            color: #3b7b9b;
            flex-shrink: 0;
        }
        body.dark .project-item .badge {
            background: rgba(78, 143, 176, 0.15);
            color: #7bb8dd;
        }
        .project-item .delete-project {
            opacity: 0;
            transition: opacity 0.2s;
            background: none;
            border: none;
            color: #b34a4a;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.1rem 0.2rem;
            border-radius: 0.4rem;
        }
        .project-item:hover .delete-project {
            opacity: 0.6;
        }
        .project-item .delete-project:hover {
            opacity: 1 !important;
            background: rgba(200, 70, 70, 0.10);
        }
        body.dark .project-item .delete-project {
            color: #e08080;
        }

        .add-project-form {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        body.dark .add-project-form {
            border-top-color: rgba(255, 255, 255, 0.06);
        }
        .add-project-form input {
            flex: 1;
            border: none;
            background: rgba(255, 255, 255, 0.5);
            padding: 0.5rem 0.8rem;
            border-radius: 1.2rem;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .add-project-form input:focus {
            border-color: rgba(59, 123, 155, 0.30);
            background: rgba(255, 255, 255, 0.7);
        }
        body.dark .add-project-form input {
            background: rgba(255, 255, 255, 0.06);
            color: #e6edf5;
        }
        body.dark .add-project-form input:focus {
            border-color: rgba(78, 143, 176, 0.30);
            background: rgba(255, 255, 255, 0.08);
        }
        .add-project-form input::placeholder {
            color: #8aabbf;
        }
        body.dark .add-project-form input::placeholder {
            color: #5a7b8f;
        }

        /* ── Main content ── */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            min-height: 400px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex: 1;
            color: #5a7b8f;
            padding: 2rem 1rem;
            gap: 0.6rem;
        }
        .empty-state .big {
            font-size: 3.5rem;
            margin-bottom: 0.2rem;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            font-weight: 500;
        }
        .empty-state p {
            max-width: 280px;
            font-size: 0.95rem;
            opacity: 0.7;
        }
        body.dark .empty-state {
            color: #8aabbf;
        }

        /* ── Project header ── */
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .project-header .title-area {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .project-header .title-area h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .project-header .title-area .edit-title {
            background: none;
            border: none;
            font-size: 1.2rem;
            padding: 0.1rem 0.4rem;
            border-radius: 0.4rem;
            cursor: pointer;
            opacity: 0.4;
            transition: 0.2s;
        }
        .project-header .title-area .edit-title:hover {
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.04);
        }
        body.dark .project-header .title-area .edit-title:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .project-header .title-area input {
            font-size: 1.5rem;
            font-weight: 700;
            border: none;
            background: transparent;
            border-bottom: 2px solid rgba(59, 123, 155, 0.20);
            padding: 0 0.2rem;
            outline: none;
            width: auto;
            min-width: 120px;
            color: inherit;
            font-family: inherit;
        }
        .project-header .title-area input:focus {
            border-bottom-color: rgba(59, 123, 155, 0.50);
        }
        body.dark .project-header .title-area input {
            border-bottom-color: rgba(78, 143, 176, 0.20);
        }
        body.dark .project-header .title-area input:focus {
            border-bottom-color: rgba(78, 143, 176, 0.50);
        }

        .project-header .actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        /* ── Progress ── */
        .progress-wrap {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 2rem;
            height: 10px;
            overflow: hidden;
            position: relative;
            width: 100%;
            margin: 0.2rem 0 0.2rem;
        }
        body.dark .progress-wrap {
            background: rgba(255, 255, 255, 0.06);
        }
        .progress-bar {
            height: 100%;
            border-radius: 2rem;
            background: linear-gradient(90deg, #3b7b9b, #6db3d9);
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            width: 0%;
        }
        body.dark .progress-bar {
            background: linear-gradient(90deg, #4e8fb0, #8ac4e6);
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #5a7b8f;
            margin-top: 0.1rem;
        }
        body.dark .progress-label {
            color: #8aabbf;
        }

        /* ── Task list ── */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 0.2rem;
        }
        .task-list::-webkit-scrollbar {
            width: 4px;
        }
        .task-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .task-list::-webkit-scrollbar-thumb {
            background: rgba(59, 123, 155, 0.20);
            border-radius: 4px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 1rem;
            padding: 0.5rem 0.8rem 0.5rem 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        body.dark .task-item {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .task-item:hover {
            background: rgba(255, 255, 255, 0.7);
        }
        body.dark .task-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }
        .task-item.done .task-main .task-name {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .task-main {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
        }
        .task-main .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #b0c8d8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.3);
        }
        body.dark .task-main .checkbox {
            border-color: #4a6a80;
            background: rgba(255, 255, 255, 0.04);
        }
        .task-main .checkbox:hover {
            border-color: #3b7b9b;
            transform: scale(1.08);
        }
        .task-main .checkbox.checked {
            background: #3b7b9b;
            border-color: #3b7b9b;
        }
        body.dark .task-main .checkbox.checked {
            background: #4e8fb0;
            border-color: #4e8fb0;
        }
        .task-main .checkbox.checked::after {
            content: "✓";
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }
        .task-main .checkbox.partial {
            border-color: #b0a84a;
            background: rgba(176, 168, 74, 0.15);
        }
        body.dark .task-main .checkbox.partial {
            border-color: #b0a84a;
            background: rgba(176, 168, 74, 0.10);
        }
        .task-main .checkbox.partial::after {
            content: "–";
            color: #b0a84a;
            font-size: 16px;
            font-weight: 700;
        }

        .task-main .task-name {
            flex: 1;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 0.1rem 0;
            word-break: break-word;
        }
        .task-main .task-name-input {
            flex: 1;
            font-size: 0.95rem;
            border: none;
            background: transparent;
            border-bottom: 1px dashed rgba(59, 123, 155, 0.20);
            padding: 0.1rem 0.2rem;
            outline: none;
            color: inherit;
            font-family: inherit;
        }
        .task-main .task-name-input:focus {
            border-bottom-color: rgba(59, 123, 155, 0.50);
        }
        body.dark .task-main .task-name-input {
            border-bottom-color: rgba(78, 143, 176, 0.20);
        }
        body.dark .task-main .task-name-input:focus {
            border-bottom-color: rgba(78, 143, 176, 0.50);
        }

        .task-main .task-actions {
            display: flex;
            gap: 0.2rem;
            flex-shrink: 0;
        }
        .task-main .task-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.1rem 0.3rem;
            border-radius: 0.4rem;
            opacity: 0.3;
            transition: 0.2s;
            color: inherit;
        }
        .task-main .task-actions button:hover {
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.04);
        }
        body.dark .task-main .task-actions button:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .task-main .task-actions .delete-task:hover {
            color: #b34a4a;
            opacity: 0.9;
        }
        body.dark .task-main .task-actions .delete-task:hover {
            color: #e08080;
        }

        /* ── Subtasks ── */
        .subtask-list {
            padding-left: 2.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-top: 0.1rem;
        }
        .subtask-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.15rem 0.2rem;
            border-radius: 0.4rem;
            font-size: 0.88rem;
        }
        .subtask-item .checkbox {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #b0c8d8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.15s;
            background: rgba(255, 255, 255, 0.2);
        }
        body.dark .subtask-item .checkbox {
            border-color: #4a6a80;
            background: rgba(255, 255, 255, 0.03);
        }
        .subtask-item .checkbox:hover {
            border-color: #3b7b9b;
            transform: scale(1.06);
        }
        .subtask-item .checkbox.checked {
            background: #3b7b9b;
            border-color: #3b7b9b;
        }
        body.dark .subtask-item .checkbox.checked {
            background: #4e8fb0;
            border-color: #4e8fb0;
        }
        .subtask-item .checkbox.checked::after {
            content: "✓";
            color: #fff;
            font-size: 11px;
            font-weight: 700;
        }
        .subtask-item .name {
            flex: 1;
            cursor: pointer;
        }
        .subtask-item .name.done {
            text-decoration: line-through;
            opacity: 0.5;
        }
        .subtask-item .sub-name-input {
            flex: 1;
            font-size: 0.88rem;
            border: none;
            background: transparent;
            border-bottom: 1px dashed rgba(59, 123, 155, 0.15);
            padding: 0 0.2rem;
            outline: none;
            color: inherit;
            font-family: inherit;
        }
        .subtask-item .sub-name-input:focus {
            border-bottom-color: rgba(59, 123, 155, 0.35);
        }
        body.dark .subtask-item .sub-name-input {
            border-bottom-color: rgba(78, 143, 176, 0.15);
        }
        body.dark .subtask-item .sub-name-input:focus {
            border-bottom-color: rgba(78, 143, 176, 0.35);
        }
        .subtask-item .delete-sub {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            opacity: 0.2;
            transition: 0.2s;
            color: inherit;
            padding: 0.1rem 0.2rem;
            border-radius: 0.3rem;
        }
        .subtask-item .delete-sub:hover {
            opacity: 0.7;
            color: #b34a4a;
        }
        body.dark .subtask-item .delete-sub:hover {
            color: #e08080;
        }

        .add-subtask-form {
            padding-left: 2.2rem;
            display: flex;
            gap: 0.3rem;
            margin-top: 0.1rem;
        }
        .add-subtask-form input {
            flex: 1;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.82rem;
            outline: none;
            border: 1px solid transparent;
            transition: 0.2s;
            color: inherit;
            font-family: inherit;
        }
        .add-subtask-form input:focus {
            border-color: rgba(59, 123, 155, 0.20);
            background: rgba(255, 255, 255, 0.5);
        }
        body.dark .add-subtask-form input {
            background: rgba(255, 255, 255, 0.04);
        }
        body.dark .add-subtask-form input:focus {
            border-color: rgba(78, 143, 176, 0.20);
            background: rgba(255, 255, 255, 0.06);
        }
        .add-subtask-form input::placeholder {
            color: #8aabbf;
            font-size: 0.8rem;
        }
        body.dark .add-subtask-form input::placeholder {
            color: #5a7b8f;
        }
        .add-subtask-form button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.4;
            transition: 0.2s;
            padding: 0 0.3rem;
        }
        .add-subtask-form button:hover {
            opacity: 0.9;
            transform: scale(1.1);
        }

        /* ── Add task ── */
        .add-task-form {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.2rem;
        }
        .add-task-form input {
            flex: 1;
            border: none;
            background: rgba(255, 255, 255, 0.4);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            font-size: 0.95rem;
            outline: none;
            border: 1px solid transparent;
            transition: 0.2s;
            color: inherit;
            font-family: inherit;
        }
        .add-task-form input:focus {
            border-color: rgba(59, 123, 155, 0.25);
            background: rgba(255, 255, 255, 0.6);
        }
        body.dark .add-task-form input {
            background: rgba(255, 255, 255, 0.05);
        }
        body.dark .add-task-form input:focus {
            border-color: rgba(78, 143, 176, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }
        .add-task-form input::placeholder {
            color: #8aabbf;
        }
        body.dark .add-task-form input::placeholder {
            color: #5a7b8f;
        }

        /* ── Confetti canvas ── */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Scrollbar global ── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(59, 123, 155, 0.20);
            border-radius: 8px;
        }
        body.dark ::-webkit-scrollbar-thumb {
            background: rgba(78, 143, 176, 0.20);
        }

        /* ── Animations ── */
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .task-item,
        .project-item {
            animation: fadeSlideIn 0.25s ease-out;
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            70% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .checkbox.checked {
            animation: pop 0.25s ease-out;
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 480px) {
            .app {
                padding: 1rem;
            }
            .header-left h1 {
                font-size: 1.3rem;
            }
            .project-header .title-area h2 {
                font-size: 1.2rem;
            }
            .project-header .title-area input {
                font-size: 1.2rem;
                min-width: 80px;
            }
            .task-main .task-name {
                font-size: 0.88rem;
            }
            .subtask-list {
                padding-left: 1.2rem;
            }
            .add-subtask-form {
                padding-left: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="emoji">🌱</span>
                <h1>Chunk</h1>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Projects</h2>
                    <span style="font-size:0.8rem;opacity:0.5;" id="projectCount">0</span>
                </div>
                <div class="project-list" id="projectList">
                    <!-- rendered by JS -->
                </div>
                <div class="add-project-form">
                    <input type="text" id="newProjectInput" placeholder="New project…" maxlength="40" />
                    <button class="btn btn-primary" id="addProjectBtn" style="padding:0.4rem 1rem;font-size:0.85rem;">+</button>
                </div>
            </aside>

            <!-- Main content -->
            <main class="main-content" id="mainContent">
                <!-- rendered by JS -->
            </main>
        </div>
    </div>

    <!-- Confetti canvas -->
    <canvas id="confetti-canvas"></canvas>

    <script>
        // ─────────────────────────────────────────────────────────────
        //  DATA LAYER
        // ─────────────────────────────────────────────────────────────

        const STORAGE_KEY = 'chunk_projects_v2';
        let projects = [];
        let activeProjectId = null;
        let editingTaskId = null;
        let editingSubtaskId = null;
        let editingProjectTitle = false;

        // ── Load / Save ──
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length) {
                        projects = parsed;
                        return;
                    }
                }
            } catch (_) { /* ignore */ }
            // Default project
            projects = [{
                id: generateId(),
                name: 'Welcome',
                tasks: [{
                    id: generateId(),
                    name: 'Break a big task into small steps',
                    done: false,
                    subtasks: [
                        { id: generateId(), name: 'Write down the main goal', done: false },
                        { id: generateId(), name: 'List 3–5 action steps', done: false },
                        { id: generateId(), name: 'Do the first step', done: false },
                    ]
                }, {
                    id: generateId(),
                    name: 'Check things off as you go',
                    done: false,
                    subtasks: [
                        { id: generateId(), name: 'Complete this task', done: false },
                        { id: generateId(), name: 'Watch the progress bar grow', done: false },
                    ]
                }, {
                    id: generateId(),
                    name: 'Celebrate small wins! 🎉',
                    done: false,
                    subtasks: [
                        { id: generateId(), name: 'Finish a task → confetti', done: false },
                        { id: generateId(), name: 'Finish a project → bigger confetti', done: false },
                    ]
                }]
            }];
            activeProjectId = projects[0].id;
            saveData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        // ─────────────────────────────────────────────────────────────
        //  HELPERS
        // ─────────────────────────────────────────────────────────────

        function getProject(id) { return projects.find(p => p.id === id); }

        function getActiveProject() { return getProject(activeProjectId); }

        function getTask(projectId, taskId) {
            const p = getProject(projectId);
            if (!p) return null;
            return p.tasks.find(t => t.id === taskId) || null;
        }

        function countDone(tasks) {
            return tasks.filter(t => t.done).length;
        }

        function countTotal(tasks) {
            return tasks.length;
        }

        function taskProgress(task) {
            if (!task.subtasks || task.subtasks.length === 0) {
                return task.done ? 1 : 0;
            }
            const done = task.subtasks.filter(s => s.done).length;
            return done / task.subtasks.length;
        }

        function projectProgress(project) {
            if (!project.tasks.length) return 0;
            let total = 0;
            let done = 0;
            for (const t of project.tasks) {
                if (t.subtasks && t.subtasks.length > 0) {
                    const subDone = t.subtasks.filter(s => s.done).length;
                    done += subDone;
                    total += t.subtasks.length;
                } else {
                    total += 1;
                    if (t.done) done += 1;
                }
            }
            return total > 0 ? done / total : 0;
        }

        function isTaskFullyDone(task) {
            if (task.subtasks && task.subtasks.length > 0) {
                return task.subtasks.every(s => s.done);
            }
            return task.done;
        }

        // ─────────────────────────────────────────────────────────────
        //  RENDER
        // ─────────────────────────────────────────────────────────────

        function render() {
            renderSidebar();
            renderMain();
            updateProjectCount();
        }

        function renderSidebar() {
            const container = document.getElementById('projectList');
            if (!projects.length) {
                container.innerHTML =
                `<div style="text-align:center;padding:1.5rem 0.5rem;opacity:0.5;font-size:0.9rem;">No projects yet</div>`;
                return;
            }
            let html = '';
            for (const p of projects) {
                const progress = projectProgress(p);
                const pct = Math.round(progress * 100);
                const isActive = p.id === activeProjectId;
                html += `
                <div class="project-item ${isActive ? 'active' : ''}" data-id="${p.id}">
                  <span class="name">${escHtml(p.name)}</span>
                  <span class="badge">${pct}%</span>
                  <button class="delete-project" data-id="${p.id}" title="Delete project">✕</button>
                </div>
              `;
            }
            container.innerHTML = html;

            // Click to switch
            container.querySelectorAll('.project-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-project')) return;
                    const id = el.dataset.id;
                    if (id && id !== activeProjectId) {
                        activeProjectId = id;
                        render();
                    }
                });
            });

            // Delete project
            container.querySelectorAll('.delete-project').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    if (!id) return;
                    if (projects.length <= 1) {
                        // Don't delete the last project; instead clear its tasks?
                        if (confirm('Delete all tasks from this project?')) {
                            const p = getProject(id);
                            if (p) { p.tasks = [];
                                saveData();
                                render(); }
                        }
                        return;
                    }
                    if (confirm(`Delete project "${getProject(id)?.name}"?`)) {
                        projects = projects.filter(p => p.id !== id);
                        if (activeProjectId === id) {
                            activeProjectId = projects.length ? projects[0].id : null;
                        }
                        saveData();
                        render();
                    }
                });
            });
        }

        function renderMain() {
            const container = document.getElementById('mainContent');
            const project = getActiveProject();

            if (!project) {
                container.innerHTML = `
                <div class="empty-state">
                  <div class="big">📂</div>
                  <h3>No project selected</h3>
                  <p>Create a new project or select one from the sidebar.</p>
                </div>
              `;
                return;
            }

            const progress = projectProgress(project);
            const pct = Math.round(progress * 100);
            const totalTasks = project.tasks.length;
            const doneTasks = project.tasks.filter(t => isTaskFullyDone(t)).length;

            let html = `
              <div class="project-header">
                <div class="title-area">
                  ${editingProjectTitle ? `
                    <input type="text" id="projectTitleInput" value="${escHtml(project.name)}" maxlength="50" autofocus />
                  ` : `
                    <h2>${escHtml(project.name)}</h2>
                    <button class="edit-title" id="editProjectTitleBtn" title="Rename project">✎</button>
                  `}
                </div>
                <div class="actions">
                  <button class="btn btn-danger btn-icon" id="clearAllTasksBtn" title="Clear all tasks" style="font-size:0.9rem;">🗑</button>
                </div>
              </div>

              <div style="margin:0.1rem 0 0.2rem;">
                <div class="progress-wrap">
                  <div class="progress-bar" style="width:${pct}%;"></div>
                </div>
                <div class="progress-label">
                  <span>${doneTasks} / ${totalTasks} done</span>
                  <span>${pct}%</span>
                </div>
              </div>

              <div class="task-list" id="taskList">
            `;

            if (!project.tasks.length) {
                html += `
                <div style="text-align:center;padding:2rem 0.5rem;opacity:0.5;font-size:0.95rem;">
                  ✨ No tasks yet — add one below!
                </div>
              `;
            } else {
                for (const task of project.tasks) {
                    const isDone = isTaskFullyDone(task);
                    const subCount = task.subtasks ? task.subtasks.length : 0;
                    const subDone = task.subtasks ? task.subtasks.filter(s => s.done).length : 0;
                    let checkClass = 'checkbox';
                    if (isDone) checkClass += ' checked';
                    else if (subCount > 0 && subDone > 0 && subDone < subCount) checkClass += ' partial';

                    const isEditing = editingTaskId === task.id;

                    html += `
                  <div class="task-item ${isDone ? 'done' : ''}" data-task-id="${task.id}">
                    <div class="task-main">
                      <div class="${checkClass}" data-task-id="${task.id}" data-toggle="task"></div>
                      ${isEditing ? `
                        <input class="task-name-input" type="text" value="${escHtml(task.name)}" data-task-id="${task.id}" data-edit="task" maxlength="80" autofocus />
                      ` : `
                        <span class="task-name" data-task-id="${task.id}" data-edit-trigger="task">${escHtml(task.name)}</span>
                      `}
                      <div class="task-actions">
                        <button data-task-id="${task.id}" data-subtoggle title="Subtasks">${subCount > 0 ? '⊞' : '⊟'}</button>
                        <button class="delete-task" data-task-id="${task.id}" title="Delete task">✕</button>
                      </div>
                    </div>
                `;

                    // Subtasks
                    if (task.subtasks && task.subtasks.length > 0) {
                        html += `<div class="subtask-list">`;
                        for (const sub of task.subtasks) {
                            const subDone = sub.done ? 'checked' : '';
                            const subDoneClass = sub.done ? 'done' : '';
                            const isSubEditing = editingSubtaskId === sub.id;
                            html += `
                            <div class="subtask-item" data-sub-id="${sub.id}">
                              <div class="checkbox ${subDone}" data-task-id="${task.id}" data-sub-id="${sub.id}" data-toggle="sub"></div>
                              ${isSubEditing ? `
                                <input class="sub-name-input" type="text" value="${escHtml(sub.name)}" data-sub-id="${sub.id}" data-edit="sub" maxlength="60" autofocus />
                              ` : `
                                <span class="name ${subDoneClass}" data-sub-id="${sub.id}" data-edit-trigger="sub">${escHtml(sub.name)}</span>
                              `}
                              <button class="delete-sub" data-task-id="${task.id}" data-sub-id="${sub.id}" title="Delete subtask">✕</button>
                            </div>
                          `;
                        }
                        html += `
                          <div class="add-subtask-form" data-task-id="${task.id}">
                            <input type="text" placeholder="Add subtask…" maxlength="60" />
                            <button data-task-id="${task.id}" data-add-sub>+</button>
                          </div>
                        `;
                        html += `</div>`;
                    } else {
                        // No subtasks: show add-subtask form directly
                        html += `
                          <div class="add-subtask-form" data-task-id="${task.id}" style="padding-left:2.2rem;margin-top:0.1rem;">
                            <input type="text" placeholder="Add subtask…" maxlength="60" />
                            <button data-task-id="${task.id}" data-add-sub>+</button>
                          </div>
                        `;
                    }

                    html += `</div>`;
                }
            }

            html += `
              </div> <!-- /task-list -->

              <div class="add-task-form">
                <input type="text" id="newTaskInput" placeholder="Add a task…" maxlength="80" />
                <button class="btn btn-primary" id="addTaskBtn" style="padding:0.4rem 1.2rem;">+ Add</button>
              </div>
            `;

            container.innerHTML = html;

            // ── Event listeners ──

            // Edit project title
            const editTitleBtn = document.getElementById('editProjectTitleBtn');
            if (editTitleBtn) {
                editTitleBtn.addEventListener('click', () => {
                    editingProjectTitle = true;
                    render();
                    const input = document.getElementById('projectTitleInput');
                    if (input) {
                        input.focus();
                        input.select();
                        input.addEventListener('blur', finishTitleEdit);
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') finishTitleEdit();
                            if (e.key === 'Escape') { editingProjectTitle = false;
                                render(); }
                        });
                    }
                });
            }

            function finishTitleEdit() {
                const input = document.getElementById('projectTitleInput');
                if (input) {
                    const val = input.value.trim();
                    if (val) {
                        const p = getActiveProject();
                        if (p) { p.name = val;
                            saveData(); }
                    }
                }
                editingProjectTitle = false;
                render();
            }

            // Clear all tasks
            const clearBtn = document.getElementById('clearAllTasksBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    const p = getActiveProject();
                    if (!p || !p.tasks.length) return;
                    if (confirm(`Delete all tasks from "${p.name}"?`)) {
                        p.tasks = [];
                        saveData();
                        render();
                    }
                });
            }

            // Toggle task (checkbox)
            document.querySelectorAll('[data-toggle="task"]').forEach(el => {
                el.addEventListener('click', () => {
                    const taskId = el.dataset.taskId;
                    const p = getActiveProject();
                    if (!p) return;
                    const task = p.tasks.find(t => t.id === taskId);
                    if (!task) return;
                    // If it has subtasks, toggle all subtasks
                    if (task.subtasks && task.subtasks.length > 0) {
                        const allDone = task.subtasks.every(s => s.done);
                        task.subtasks.forEach(s => s.done = !allDone);
                    } else {
                        task.done = !task.done;
                    }
                    // If all subtasks are done, mark task done? Actually we use isTaskFullyDone for display.
                    saveData();
                    if (isTaskFullyDone(task)) {
                        triggerConfetti(30);
                    }
                    render();
                });
            });

            // Toggle subtask
            document.querySelectorAll('[data-toggle="sub"]').forEach(el => {
                el.addEventListener('click', () => {
                    const taskId = el.dataset.taskId;
                    const subId = el.dataset.subId;
                    const p = getActiveProject();
                    if (!p) return;
                    const task = p.tasks.find(t => t.id === taskId);
                    if (!task) return;
                    const sub = task.subtasks.find(s => s.id === subId);
                    if (!sub) return;
                    sub.done = !sub.done;
                    // Auto-mark parent done if all subtasks done
                    if (task.subtasks.every(s => s.done)) {
                        // parent considered done via isTaskFullyDone
                    }
                    saveData();
                    // Check if all subtasks of this task are now done
                    if (task.subtasks.every(s => s.done)) {
                        triggerConfetti(20);
                    }
                    render();
                });
            });

            // Edit task name (click on name)
            document.querySelectorAll('[data-edit-trigger="task"]').forEach(el => {
                el.addEventListener('click', () => {
                    const taskId = el.dataset.taskId;
                    editingTaskId = taskId;
                    render();
                    const input = document.querySelector(`[data-edit="task"][data-task-id="${taskId}"]`);
                    if (input) {
                        input.focus();
                        input.select();
                        input.addEventListener('blur', finishTaskEdit);
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') finishTaskEdit();
                            if (e.key === 'Escape') { editingTaskId = null;
                                render(); }
                        });
                    }
                });
            });

            function finishTaskEdit() {
                const input = document.querySelector('[data-edit="task"]');
                if (input) {
                    const val = input.value.trim();
                    if (val) {
                        const p = getActiveProject();
                        if (p) {
                            const task = p.tasks.find(t => t.id === input.dataset.taskId);
                            if (task) { task.name = val;
                                saveData(); }
                        }
                    }
                }
                editingTaskId = null;
                render();
            }

            // Edit subtask name
            document.querySelectorAll('[data-edit-trigger="sub"]').forEach(el => {
                el.addEventListener('click', () => {
                    const subId = el.dataset.subId;
                    editingSubtaskId = subId;
                    render();
                    const input = document.querySelector(`[data-edit="sub"][data-sub-id="${subId}"]`);
                    if (input) {
                        input.focus();
                        input.select();
                        input.addEventListener('blur', finishSubEdit);
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') finishSubEdit();
                            if (e.key === 'Escape') { editingSubtaskId = null;
                                render(); }
                        });
                    }
                });
            });

            function finishSubEdit() {
                const input = document.querySelector('[data-edit="sub"]');
                if (input) {
                    const val = input.value.trim();
                    if (val) {
                        const p = getActiveProject();
                        if (p) {
                            const task = p.tasks.find(t => t.subtasks && t.subtasks.some(s => s.id === input.dataset.subId));
                            if (task) {
                                const sub = task.subtasks.find(s => s.id === input.dataset.subId);
                                if (sub) { sub.name = val;
                                    saveData(); }
                            }
                        }
                    }
                }
                editingSubtaskId = null;
                render();
            }

            // Delete task
            document.querySelectorAll('.delete-task').forEach(btn => {
                btn.addEventListener('click', () => {
                    const taskId = btn.dataset.taskId;
                    const p = getActiveProject();
                    if (!p) return;
                    if (confirm('Delete this task?')) {
                        p.tasks = p.tasks.filter(t => t.id !== taskId);
                        saveData();
                        render();
                    }
                });
            });

            // Delete subtask
            document.querySelectorAll('.delete-sub').forEach(btn => {
                btn.addEventListener('click', () => {
                    const taskId = btn.dataset.taskId;
                    const subId = btn.dataset.subId;
                    const p = getActiveProject();
                    if (!p) return;
                    const task = p.tasks.find(t => t.id === taskId);
                    if (!task) return;
                    task.subtasks = task.subtasks.filter(s => s.id !== subId);
                    saveData();
                    render();
                });
            });

            // Add subtask
            document.querySelectorAll('[data-add-sub]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const taskId = btn.dataset.taskId;
                    const container = btn.closest('.add-subtask-form');
                    const input = container.querySelector('input');
                    if (!input) return;
                    const val = input.value.trim();
                    if (!val) return;
                    const p = getActiveProject();
                    if (!p) return;
                    const task = p.tasks.find(t => t.id === taskId);
                    if (!task) return;
                    if (!task.subtasks) task.subtasks = [];
                    task.subtasks.push({ id: generateId(), name: val, done: false });
                    saveData();
                    render();
                    // focus the input again after render
                    requestAnimationFrame(() => {
                        const newInput = document.querySelector(`.add-subtask-form[data-task-id="${taskId}"] input`);
                        if (newInput) newInput.focus();
                    });
                });
            });

            // Add subtask on Enter
            document.querySelectorAll('.add-subtask-form input').forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const btn = input.closest('.add-subtask-form').querySelector('[data-add-sub]');
                        if (btn) btn.click();
                    }
                });
            });

            // Add task
            const addTaskBtn = document.getElementById('addTaskBtn');
            const newTaskInput = document.getElementById('newTaskInput');
            if (addTaskBtn && newTaskInput) {
                const addTask = () => {
                    const val = newTaskInput.value.trim();
                    if (!val) return;
                    const p = getActiveProject();
                    if (!p) return;
                    p.tasks.push({ id: generateId(), name: val, done: false, subtasks: [] });
                    saveData();
                    render();
                    newTaskInput.value = '';
                    newTaskInput.focus();
                };
                addTaskBtn.addEventListener('click', addTask);
                newTaskInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') addTask();
                });
            }

            // Subtask toggle visibility (⊞ / ⊟) — expand/collapse subtasks? 
            // We'll just show/hide subtask lists via a simple toggle.
            document.querySelectorAll('[data-subtoggle]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const taskId = btn.dataset.taskId;
                    const item = btn.closest('.task-item');
                    const list = item.querySelector('.subtask-list');
                    const addForm = item.querySelector('.add-subtask-form');
                    if (list) {
                        const isHidden = list.style.display === 'none';
                        list.style.display = isHidden ? 'flex' : 'none';
                        if (addForm) addForm.style.display = isHidden ? 'flex' : 'none';
                        btn.textContent = isHidden ? '⊟' : '⊞';
                    } else {
                        // If no subtask-list, show the add form only
                        if (addForm) {
                            const isHidden = addForm.style.display === 'none';
                            addForm.style.display = isHidden ? 'flex' : 'none';
                            btn.textContent = isHidden ? '⊟' : '⊞';
                        }
                    }
                });
            });

            // After render, set initial visibility for subtask toggles
            document.querySelectorAll('.task-item').forEach(item => {
                const list = item.querySelector('.subtask-list');
                const addForm = item.querySelector('.add-subtask-form');
                const btn = item.querySelector('[data-subtoggle]');
                if (list && btn) {
                    // Default: visible if there are subtasks
                    const hasSubs = list.querySelectorAll('.subtask-item').length > 0;
                    if (!hasSubs) {
                        list.style.display = 'none';
                        if (addForm) addForm.style.display = 'none';
                        btn.textContent = '⊞';
                    } else {
                        list.style.display = 'flex';
                        if (addForm) addForm.style.display = 'flex';
                        btn.textContent = '⊟';
                    }
                } else if (addForm && btn) {
                    // No subtask-list, just the add form
                    const hasSubs = item.querySelectorAll('.subtask-item').length > 0;
                    if (!hasSubs) {
                        addForm.style.display = 'none';
                        btn.textContent = '⊞';
                    } else {
                        addForm.style.display = 'flex';
                        btn.textContent = '⊟';
                    }
                }
            });
        }

        function updateProjectCount() {
            const el = document.getElementById('projectCount');
            if (el) el.textContent = projects.length;
        }

        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ─────────────────────────────────────────────────────────────
        //  CONFETTI
        // ─────────────────────────────────────────────────────────────

        let confettiPieces = [];
        let confettiAnimId = null;
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiRunning = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti(count = 40) {
            const colors = ['#3b7b9b', '#6db3d9', '#f0c27a', '#f5a97f', '#b8d4e3', '#f2d9b3', '#e8a87c', '#7fc3b0'];
            for (let i = 0; i < count; i++) {
                confettiPieces.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 120,
                    y: canvas.height / 2 - 80 + Math.random() * 60,
                    w: 6 + Math.random() * 8,
                    h: 4 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 10,
                    vy: -4 - Math.random() * 8,
                    rot: Math.random() * 360,
                    rv: (Math.random() - 0.5) * 12,
                    life: 1,
                    decay: 0.008 + Math.random() * 0.012,
                });
            }
            if (!confettiRunning) {
                confettiRunning = true;
                animateConfetti();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let alive = false;
            for (const p of confettiPieces) {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.rot += p.rv;
                p.life -= p.decay;
                if (p.life <= 0) continue;
                alive = true;
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rot * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            }
            confettiPieces = confettiPieces.filter(p => p.life > 0);
            if (alive || confettiPieces.length) {
                confettiAnimId = requestAnimationFrame(animateConfetti);
            } else {
                confettiRunning = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (confettiAnimId) { cancelAnimationFrame(confettiAnimId);
                    confettiAnimId = null; }
            }
        }

        // ─────────────────────────────────────────────────────────────
        //  THEME
        // ─────────────────────────────────────────────────────────────

        const themeToggle = document.getElementById('themeToggle');
        let darkMode = localStorage.getItem('chunk_theme') === 'dark';

        function applyTheme() {
            document.body.classList.toggle('dark', darkMode);
            themeToggle.textContent = darkMode ? '☀️' : '🌙';
            localStorage.setItem('chunk_theme', darkMode ? 'dark' : 'light');
        }
        applyTheme();

        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            applyTheme();
        });

        // ─────────────────────────────────────────────────────────────
        //  ADD PROJECT
        // ─────────────────────────────────────────────────────────────

        const newProjectInput = document.getElementById('newProjectInput');
        const addProjectBtn = document.getElementById('addProjectBtn');

        function addProject() {
            const val = newProjectInput.value.trim();
            if (!val) return;
            const newP = {
                id: generateId(),
                name: val,
                tasks: []
            };
            projects.push(newP);
            activeProjectId = newP.id;
            saveData();
            render();
            newProjectInput.value = '';
            newProjectInput.focus();
            triggerConfetti(25);
        }

        addProjectBtn.addEventListener('click', addProject);
        newProjectInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addProject();
        });

        // ─────────────────────────────────────────────────────────────
        //  INIT
        // ─────────────────────────────────────────────────────────────

        loadData();
        // Ensure activeProjectId is valid
        if (!getProject(activeProjectId) && projects.length) {
            activeProjectId = projects[0].id;
        }
        render();

        // ── Keyboard shortcut: focus new task ──
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                const input = document.getElementById('newTaskInput');
                if (input) input.focus();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
                const input = document.getElementById('newProjectInput');
                if (input) input.focus();
            }
        });

        // Small intro confetti to welcome
        setTimeout(() => triggerConfetti(18), 400);
        console.log('🌱 Chunk loaded — break it down, tick it off, feel good!');
    </script>
</body>
</html>
